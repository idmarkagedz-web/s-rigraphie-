<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابات ورشة السيريغرافي</title>
<meta name="theme-color" content="#0f6e56">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#e3e1da;--ac:#0f6e56;--ac2:#e8f3ef;--rd:#b3261e;--am:#9a6700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--card:#222220;--tx:#f1efe8;--mu:#a3a199;--bd:#34342f;--ac:#4fc3a1;--ac2:#1e2f2a;--rd:#f2877f;--am:#e0b04a}}
:root[data-theme="dark"]{--bg:#161614;--card:#222220;--tx:#f1efe8;--mu:#a3a199;--bd:#34342f;--ac:#4fc3a1;--ac2:#1e2f2a;--rd:#f2877f;--am:#e0b04a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px;padding-bottom:76px}
h1{font-size:18px;margin:0;padding:14px 16px}
main{padding:0 12px 12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.k small{color:var(--mu);display:block;font-size:12px}
.k b{font-size:17px}
.pos{color:var(--ac)}.neg{color:var(--rd)}.warn{color:var(--am)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:6px}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.s{background:var(--ac2);color:var(--ac)}
button.d{background:transparent;color:var(--rd);padding:6px 8px}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1}
.it{border-bottom:1px solid var(--bd);padding:10px 0}
.it:last-child{border:0}
.mu{color:var(--mu);font-size:13px}
.sp{display:flex;justify-content:space-between;gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:11px}
nav button.on{color:var(--ac);font-weight:700}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}
@media print{nav,h1,.row{display:none}body{background:#fff;color:#000}.card,.k{border-color:#999}}
</style>
</head>
<body>
<h1>🖨️ حسابات الورشة</h1>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
let S={orders:[],exp:[],stock:[],cur:'',shop:'',per:'all',rm:''};
try{const r=localStorage.getItem('atl');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('atl',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>Number(v)||0;
const fmt=v=>n(v).toLocaleString('en-US',{maximumFractionDigits:2})+(S.cur?' '+esc(S.cur):'');
const today=()=>new Date().toISOString().slice(0,10);
const CATS=['حبر ومواد','شاشات وإطارات','أقمشة وتيشيرتات','إيجار','كهرباء وماء','رواتب','نقل','أخرى'];
const TABS=[['home','📊 الملخص'],['orders','🧾 الطلبيات'],['exp','💸 المصاريف'],['stock','📦 المخزون'],['rep','📈 التقارير'],['set','⚙️ الإعدادات']];
let tab='home',V=null;
const tot=o=>n(o.qty)*n(o.price);
function go(t){tab=t;V=null;render()}
function inv(id){V=id;render()}
function val(id){return $('#'+id).value.trim()}
function addOrder(){
  if(!val('c')||!n(val('q'))||!n(val('p')))return;
  S.orders.push({id:Date.now(),date:today(),client:val('c'),desc:val('d'),qty:n(val('q')),price:n(val('p')),paid:n(val('pd')),done:false});
  save();render();
}
function addExp(){
  if(!n(val('a')))return;
  S.exp.push({id:Date.now(),date:today(),cat:val('k'),amount:n(val('a')),note:val('nt')});
  save();render();
}
function pay(id){
  const o=S.orders.find(x=>x.id===id),v=n($('#pay'+id).value);
  if(o&&v>0){o.paid=Math.min(tot(o),n(o.paid)+v);save();render()}
}
function toggle(id){const o=S.orders.find(x=>x.id===id);o.done=!o.done;save();render()}
function del(t,id,b){
  if(!b.dataset.s){b.dataset.s=1;b.textContent='تأكيد؟';setTimeout(()=>{b.dataset.s='';b.textContent='حذف'},2500);return}
  S[t]=S[t].filter(x=>x.id!==id);save();render();
}
function setPer(v){S.per=v;save();render()}
function setCur(v){S.cur=v.trim();save()}
function exportData(){
  const t=$('#bk');t.value=JSON.stringify(S);t.select();
  try{navigator.clipboard.writeText(t.value)}catch(e){}
}
function importData(){
  try{const d=JSON.parse($('#bk').value);if(!Array.isArray(d.orders)||!Array.isArray(d.exp))throw 0;S=Object.assign({orders:[],exp:[],stock:[],cur:'',shop:'',per:'all',rm:''},d);save();render();alert('تم الاستيراد')}
  catch(e){alert('نص غير صالح')}
}
function invText(o){const i=S.orders.indexOf(o)+1;return `${S.shop||'فاتورة'}\nفاتورة رقم ${String(i).padStart(4,'0')} - ${o.date}\nالعميل: ${o.client}\n${o.desc||'طباعة'}: ${o.qty} × ${o.price}\nالإجمالي: ${fmt(tot(o))}\nالمدفوع: ${fmt(o.paid)}\nالمتبقي: ${fmt(tot(o)-n(o.paid))}`.replace(/&amp;/g,'&')}
function invoice(){
 const o=S.orders.find(x=>x.id===V);if(!o){V=null;return ''}
 const i=S.orders.indexOf(o)+1,r=tot(o)-n(o.paid);
 return `<div class="card"><div class="sp"><b style="font-size:18px">${esc(S.shop||'فاتورة')}</b><span>فاتورة رقم ${String(i).padStart(4,'0')}</span></div><div class="mu">التاريخ: ${o.date}</div><div class="it">العميل: <b>${esc(o.client)}</b></div><div class="it sp"><span>${esc(o.desc||'طباعة')}</span><span>${o.qty} × ${fmt(o.price)}</span></div><div class="it sp"><span>الإجمالي</span><b>${fmt(tot(o))}</b></div><div class="it sp"><span>المدفوع</span><b>${fmt(o.paid)}</b></div><div class="sp" style="padding-top:8px"><span>المتبقي</span><b class="${r>0?'warn':'pos'}">${fmt(r)}</b></div></div><div class="row"><button onclick="window.print()">طباعة / PDF</button><button class="s" onclick="shareInv()">مشاركة نصية</button><button class="s" onclick="V=null;render()">رجوع</button></div><div id="msg" class="mu" style="margin-top:8px"></div>`}
function shareInv(){
 const o=S.orders.find(x=>x.id===V),t=invText(o);
 if(navigator.share){navigator.share({text:t}).catch(()=>{});return}
 try{navigator.clipboard.writeText(t);$('#msg').textContent='تم نسخ الفاتورة، الصقها في واتساب'}catch(e){$('#msg').textContent='تعذر النسخ'}
}
function addStock(){if(!val('sn'))return;S.stock.push({id:Date.now(),name:val('sn'),qty:n(val('sq')),min:n(val('sm'))});save();render()}
function adj(id,d){const s=S.stock.find(x=>x.id===id);s.qty=Math.max(0,n(s.qty)+d);save();render()}
function stock(){
 const l=S.stock.map(s=>{const low=n(s.min)>0&&n(s.qty)<=n(s.min);return `<div class="it"><div class="sp"><b>${esc(s.name)}</b><b class="${low?'neg':'pos'}">${s.qty}${low?' ⚠️':''}</b></div><div class="mu">حد التنبيه: ${n(s.min)}</div><div class="row" style="margin-top:6px"><button class="s" onclick="adj(${s.id},-1)">−1</button><button class="s" onclick="adj(${s.id},1)">+1</button><button class="s" onclick="adj(${s.id},10)">+10</button><button class="d" onclick="del('stock',${s.id},this)">حذف</button></div></div>`}).join('');
 return `<div class="card"><b>صنف جديد</b><input id="sn" placeholder="مثال: حبر أبيض / تيشيرت L"><div class="row"><input id="sq" type="number" inputmode="decimal" placeholder="الكمية"><input id="sm" type="number" inputmode="decimal" placeholder="حد التنبيه"></div><button onclick="addStock()" style="width:100%">إضافة</button></div><div class="card">${l||'<div class="mu">لا توجد أصناف</div>'}</div>`}
function rep(){
 const ms=new Set([today().slice(0,7)]);S.orders.concat(S.exp).forEach(x=>ms.add(x.date.slice(0,7)));
 const L=[...ms].sort().reverse();
 const row=m=>{const os=S.orders.filter(o=>o.date.startsWith(m)),ex=S.exp.filter(e=>e.date.startsWith(m));const s=os.reduce((a,o)=>a+tot(o),0),p=os.reduce((a,o)=>a+n(o.paid),0),x=ex.reduce((a,e)=>a+n(e.amount),0);return{m,c:os.length,s,p,x,net:p-x}};
 const R=L.map(row),sel=L.includes(S.rm)?S.rm:L[0],cur=R.find(r=>r.m===sel);
 const cat={},cl={};
 S.exp.filter(e=>e.date.startsWith(sel)).forEach(e=>cat[e.cat]=(cat[e.cat]||0)+n(e.amount));
 S.orders.filter(o=>o.date.startsWith(sel)).forEach(o=>cl[o.client]=(cl[o.client]||0)+tot(o));
 const li=(O,c)=>Object.entries(O).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="it sp"><span>${esc(k)}</span><b class="${c}">${fmt(v)}</b></div>`).join('')||'<div class="mu">لا توجد بيانات</div>';
 return `<div class="card"><b>تقرير شهري</b><select onchange="S.rm=this.value;save();render()">${L.map(m=>`<option ${m===sel?'selected':''}>${m}</option>`).join('')}</select>
<div class="grid"><div class="k"><small>عدد الطلبيات</small><b>${cur.c}</b></div><div class="k"><small>المبيعات</small><b>${fmt(cur.s)}</b></div><div class="k"><small>المقبوض</small><b class="pos">${fmt(cur.p)}</b></div><div class="k"><small>المصاريف</small><b class="neg">${fmt(cur.x)}</b></div></div>
<div class="k" style="margin-top:8px"><small>صافي الربح</small><b class="${cur.net<0?'neg':'pos'}">${fmt(cur.net)}</b></div></div>
<div class="card"><b>المصاريف حسب النوع</b>${li(cat,'neg')}</div><div class="card"><b>مبيعات العملاء</b>${li(cl,'')}</div>
<div class="card"><b>كل الأشهر</b><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th>الشهر</th><th>مبيعات</th><th>مقبوض</th><th>مصاريف</th><th>صافي</th></tr>${R.map(r=>`<tr><td>${r.m}</td><td>${fmt(r.s)}</td><td>${fmt(r.p)}</td><td>${fmt(r.x)}</td><td class="${r.net<0?'neg':'pos'}">${fmt(r.net)}</td></tr>`).join('')}</table></div></div>
<div class="row"><button onclick="window.print()">طباعة التقرير</button></div>`}
function home(){
  const ym=today().slice(0,7),f=d=>S.per==='all'||d.startsWith(ym);
  const os=S.orders.filter(o=>f(o.date)),ex=S.exp.filter(e=>f(e.date));
  const sales=os.reduce((a,o)=>a+tot(o),0),paid=os.reduce((a,o)=>a+n(o.paid),0);
  const exp=ex.reduce((a,e)=>a+n(e.amount),0),net=paid-exp;
  const debt={};
  S.orders.forEach(o=>{const r=tot(o)-n(o.paid);if(r>0)debt[o.client]=(debt[o.client]||0)+r});
  const dl=Object.entries(debt).sort((a,b)=>b[1]-a[1]);
  return `<div class="card"><select onchange="setPer(this.value)"><option value="all" ${S.per==='all'?'selected':''}>كل الفترات</option><option value="m" ${S.per==='m'?'selected':''}>هذا الشهر</option></select>
  <div class="grid"><div class="k"><small>المبيعات</small><b>${fmt(sales)}</b></div><div class="k"><small>المقبوض</small><b class="pos">${fmt(paid)}</b></div><div class="k"><small>المصاريف</small><b class="neg">${fmt(exp)}</b></div><div class="k"><small>صافي الربح (مقبوض − مصاريف)</small><b class="${net<0?'neg':'pos'}">${fmt(net)}</b></div></div></div>
  ${S.stock.some(s=>n(s.min)>0&&n(s.qty)<=n(s.min))?'<div class="card"><b class="warn">⚠️ مخزون منخفض</b>'+S.stock.filter(s=>n(s.min)>0&&n(s.qty)<=n(s.min)).map(s=>`<div class="it sp"><span>${esc(s.name)}</span><b class="neg">${s.qty}</b></div>`).join('')+'</div>':''}<div class="card"><b>ديون العملاء</b>${dl.length?dl.map(([c,v])=>`<div class="it sp"><span>${esc(c)}</span><b class="warn">${fmt(v)}</b></div>`).join(''):'<div class="mu">لا توجد ديون 👌</div>'}</div>`;
}
function orders(){
  const l=[...S.orders].reverse().map(o=>{
    const r=tot(o)-n(o.paid);
    return `<div class="it"><div class="sp"><b>${esc(o.client)}</b><span class="mu">${o.date}</span></div>
    <div class="mu">${esc(o.desc)} — ${o.qty} × ${fmt(o.price)}</div>
    <div class="sp"><span>الإجمالي: <b>${fmt(tot(o))}</b></span><span>${r>0?`<b class="warn">المتبقي: ${fmt(r)}</b>`:'<b class="pos">مدفوع ✓</b>'}</span></div>
    ${r>0?`<div class="row" style="margin-top:6px"><input id="pay${o.id}" type="number" inputmode="decimal" placeholder="دفعة جديدة" style="margin:0"><button class="s" onclick="pay(${o.id})">تسجيل دفعة</button></div>`:''}
    <div class="row" style="margin-top:6px"><button class="s" onclick="toggle(${o.id})">${o.done?'✅ تم التسليم':'⏳ قيد التنفيذ'}</button><button class="s" onclick="inv(${o.id})">🧾 فاتورة</button><button class="d" onclick="del('orders',${o.id},this)">حذف</button></div></div>`}).join('');
  return `<div class="card"><b>طلبية جديدة</b><input id="c" placeholder="اسم العميل"><input id="d" placeholder="الوصف (مثال: طباعة تيشيرت)">
  <div class="row"><input id="q" type="number" inputmode="decimal" placeholder="الكمية"><input id="p" type="number" inputmode="decimal" placeholder="سعر الوحدة"></div>
  <input id="pd" type="number" inputmode="decimal" placeholder="العربون المدفوع (اختياري)"><button onclick="addOrder()" style="width:100%">إضافة</button></div>
  <div class="card">${l||'<div class="mu">لا توجد طلبيات بعد</div>'}</div>`;
}
function exps(){
  const l=[...S.exp].reverse().map(e=>`<div class="it sp"><div><b>${esc(e.cat)}</b> <span class="mu">${e.date}</span><div class="mu">${esc(e.note)}</div></div><div><b class="neg">${fmt(e.amount)}</b><br><button class="d" onclick="del('exp',${e.id},this)">حذف</button></div></div>`).join('');
  return `<div class="card"><b>مصروف جديد</b><select id="k">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id="a" type="number" inputmode="decimal" placeholder="المبلغ"><input id="nt" placeholder="ملاحظة (اختياري)"><button onclick="addExp()" style="width:100%">إضافة</button></div>
  <div class="card">${l||'<div class="mu">لا توجد مصاريف بعد</div>'}</div>`;
}
function set(){
  return `<div class="card"><b>اسم الورشة (يظهر في الفاتورة)</b><input value="${esc(S.shop)}" oninput="S.shop=this.value.trim();save()"></div><div class="card"><b>العملة</b><input value="${esc(S.cur)}" placeholder="مثال: دج" oninput="setCur(this.value)"></div>
  <div class="card"><b>نسخة احتياطية</b><div class="mu" style="margin:4px 0 8px">البيانات محفوظة داخل هاتفك فقط. صدّر نصاً واحفظه في ملاحظاتك أو أرسله لنفسك، ثم الصقه هنا للاستيراد.</div>
  <textarea id="bk" rows="5"></textarea><div class="row"><button onclick="exportData()">تصدير</button><button class="s" onclick="importData()">استيراد</button></div></div>`;
}
function render(){
  $('#nav').innerHTML=TABS.map(([k,t])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${t}</button>`).join('');
  $('#app').innerHTML=V?invoice():{home,orders,exp:exps,stock,rep,set}[tab]();
  scrollTo(0,0);
}
render();
</script>
</body>
</html>
